name: Source Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit committed source
        run: node tools/audit-staged.cjs
      - name: Check script syntax
        run: |
          node --check web/stats.js
          node --check web/accounting.js
          node --check tools/audit-staged.cjs
          bash -n package-release.sh
